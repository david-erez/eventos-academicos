<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Eventos Académicos</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #2563eb, #1e3a8a);
    }

    .login-container{
      width:350px;
      background:white;
      padding:40px;
      border-radius:15px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    .login-container h2{
      text-align:center;
      margin-bottom:30px;
      color:#1e3a8a;
    }

    .input-group{
      margin-bottom:20px;
    }

    .input-group label{
      display:block;
      margin-bottom:5px;
      color:#333;
      font-weight:bold;
    }

    .input-group input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
      transition:0.3s;
    }

    .input-group input:focus{
      border-color:#2563eb;
    }

    .btn-login{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#2563eb;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .btn-login:hover{
      background:#1e40af;
    }

    .extra-links{
      margin-top:15px;
      text-align:center;
    }

    .extra-links a{
      text-decoration:none;
      color:#2563eb;
      font-size:14px;
    }

    .extra-links a:hover{
      text-decoration:underline;
    }
  </style>
</head>

<body>

  <div class="login-container">
    <h2>Iniciar Sesión</h2>

    <form>
      <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="Ingrese su correo" required>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Ingrese su contraseña" required>
      </div>

      <button type="submit" class="btn-login">
        Ingresar
      </button>

      <div class="extra-links">
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>
    </form>
  </div>

</body>
</html>
